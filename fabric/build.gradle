plugins {
    id 'fabric-loom'
}

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

repositories {
    maven { name = 'ParchmentMC'; url = 'https://maven.parchmentmc.org' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${minecraft_version}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // So para testar junto de outros mods no desenvolvimento (ex.: Cobblemon). Coloque os .jar em
    // fabric/libs-teste/; eles nao entram no jar do mod.
    modRuntimeOnly fileTree(dir: 'libs-teste', include: '*.jar')
}

loom {
    runs {
        // gradlew :fabric:runAutoteste -> abre um mundo plano, liga cada aura e tira prints
        autoteste {
            client()
            name = 'Autoteste'
            vmArg '-Dauras.autoteste=true'
            vmArg "-Dauras.autoteste.auras=${project.findProperty('autotesteAuras') ?: ''}"
            vmArg "-Dauras.autoteste.quadros=${project.findProperty('autotesteQuadros') ?: '60'}"
            vmArg "-Dauras.autoteste.hora=${project.findProperty('autotesteHora') ?: '13000'}"
            vmArg "-Dauras.autoteste.fov=${project.findProperty('autotesteFov') ?: '70'}"
            programArgs '--width', '1280', '--height', '720'
            runDir 'run/autoteste'
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}
